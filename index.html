<!DOCTYPE html>
<html>

<head>
  <title>Loading...</title>
  <link rel="stylesheet" href="assets/css/splash.css">
</head>

<body>
  <div class="splash">
    <img src="assets/icon.png" alt="JBerry POS Logo" class="logo-img">
    <h1>JBerry POS</h1>
    <div class="loader" id="loader"></div>

    <!-- No Internet Error -->
    <div id="noInternetError" class="no-internet-modal hidden">
      <div class="modal-icon text-danger">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h2>No Internet Connection</h2>
      <p>Please check your network settings and try again.</p>
      <div class="modal-buttons">
        <button id="reconnectBtn" class="modal-btn confirm">Reconnect</button>
        <button id="exitBtn" class="modal-btn danger">Exit</button>
      </div>
    </div>
  </div>
  <script src="assets/js/splash.js"></script>
</body>

</html>
